name: toyota_dashboard
description: Toyota Live OBD Dashboard via ELM327 Bluetooth
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Bluetooth Classic (SPP) for ELM327
  flutter_bluetooth_serial: ^0.4.0

  # Gauge widgets (optional but useful)
  syncfusion_flutter_gauges: ^24.2.0

  # State management (optional but clean)
  provider: ^6.1.2

  # Icons
  cupertino_icons: ^1.0.6
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true